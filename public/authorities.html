<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark-mode');</script>
    <title>District Authorities - JanAwaaz</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/forms.css">
    <style>
        :root {
            --auth-bg: #f8fafc;
            --auth-card: #ffffff;
            --auth-input: #f1f5f9;
            --auth-text: #0f172a;
            --auth-text-muted: #64748b;
            --auth-accent: #0284c7;
            --auth-border: #e2e8f0;
            --auth-header-grad: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            --auth-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .dark-mode {
            --auth-bg: #000000;
            --auth-card: #111111;
            --auth-input: #1a1a1a;
            --auth-text: #ffffff;
            --auth-text-muted: #a0aec0;
            --auth-accent: #54f0df;
            --auth-border: #2d3748;
            --auth-header-grad: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
            --auth-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .authorities-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .authorities-header {
            text-align: left;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--auth-border);
            padding-bottom: 20px;
        }

        .authorities-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--auth-text);
            margin: 0;
            background: var(--auth-header-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-section {
            background: var(--auth-card);
            border: 1px solid var(--auth-border);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 32px;
            backdrop-filter: blur(20px);
            box-shadow: var(--auth-shadow);
        }

        .search-input-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-input-wrapper input {
            flex: 1;
            padding: 16px 24px;
            background: var(--auth-input);
            border: 1px solid var(--auth-border);
            border-radius: 16px;
            color: var(--auth-text);
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: var(--auth-accent);
            background: var(--auth-card);
            box-shadow: 0 0 0 4px rgba(var(--auth-accent-rgb, 84, 240, 223), 0.1);
        }

        .search-btn {
            padding: 16px 40px;
            background: linear-gradient(135deg, #54f0df 0%, #2dd6d6 100%);
            border: none;
            border-radius: 16px;
            color: #0a1628;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(84, 240, 223, 0.2);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(84, 240, 223, 0.4);
        }

        .filters-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .filter-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--auth-text-muted);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .filter-select {
            width: 100%;
            padding: 14px 20px;
            background: var(--auth-input);
            border: 1px solid var(--auth-border);
            border-radius: 14px;
            color: var(--auth-text);
            font-size: 1rem;
            cursor: pointer;
            appearance: none;
            transition: all 0.3s ease;
        }

        .filter-select:hover {
            border-color: var(--auth-accent);
        }

        .select-wrapper::after {
            content: '↓';
            font-family: system-ui;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--auth-accent);
            pointer-events: none;
            font-size: 0.8rem;
        }

        .summary-section {
            background: var(--auth-card);
            border: 1px solid var(--auth-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: var(--auth-shadow);
        }

        .summary-stats {
            display: flex;
            gap: 40px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--auth-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--auth-accent);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .authority-card {
            background: var(--auth-card);
            border: 1px solid var(--auth-border);
            border-radius: 24px;
            padding: 28px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: var(--auth-shadow);
        }

        .authority-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--auth-accent), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .authority-card:hover {
            transform: translateY(-8px);
            background: var(--auth-card);
            border-color: var(--auth-accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        .dark-mode .authority-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .authority-card:hover::before {
            opacity: 1;
        }

        .authority-card-header {
            margin-bottom: 20px;
        }

        .authority-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--auth-text);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .authority-designation {
            font-size: 0.95rem;
            color: var(--auth-accent);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .authority-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(var(--auth-accent-rgb, 84, 240, 223), 0.1);
            border: 1px solid var(--auth-border);
            border-radius: 100px;
            color: var(--auth-accent);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 12px;
        }

        .authority-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--auth-border);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-item label {
            font-size: 0.75rem;
            color: var(--auth-text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .detail-item value {
            font-size: 0.95rem;
            color: var(--auth-text);
            font-weight: 500;
        }

        .rating-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 4px 10px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            width: fit-content;
        }

        .results-empty-message {
            grid-column: 1 / -1;
            padding: 80px 0;
            color: var(--auth-text-muted);
            font-size: 1.2rem;
            text-align: center;
            background: var(--auth-card);
            border-radius: 24px;
            border: 2px dashed var(--auth-border);
        }

        /* Responsive */
        @media (max-width: 992px) {
            .filters-wrapper {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .authorities-container {
                padding: 24px 16px;
            }
            .filters-wrapper {
                grid-template-columns: 1fr;
            }
            .summary-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .summary-stats {
                width: 100%;
                justify-content: space-between;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="feed-layout">
        <!-- Left Sidebar Navigation -->
        <aside class="feed-sidebar-left">
            <div class="sidebar-logo">
                <a href="/"></a>
            </div>
            <nav class="sidebar-nav">
                <a href="/home" title="Home">
                    <span class="nav-icon">🏠</span>
                    <span>Home</span>
                </a>
                <a href="/india" title="India Feed">
                    <img src="https://tse4.mm.bing.net/th/id/OIP.9oc-FCMJoyYZtm2HJWnsKAHaE7?w=2000&h=1333&rs=1&pid=ImgDetMain&o=7&rm=3" class="nav-icon india-flag-img" alt="India Flag">
                    <span>India</span>
                </a>
                <a href="/district" title="District Feed">
                    <span class="nav-icon">📍</span>
                    <span>District</span>
                </a>
                <a href="/authorities" id="navAuthorities" class="active" style="display:none;" title="Search">
                    <span class="nav-icon">🏛️</span>
                    <span>Search</span>
                </a>
                <a href="/leaderboard" title="Leaderboard">
                    <span class="nav-icon">🏆</span>
                    <span>Leaderboard</span>
                </a>
                <a href="/notifications" id="navNotifications" title="Notifications">
                    <span class="nav-icon">🔔</span>
                    <span>Notifications</span>
                </a>
                <a href="/profile" title="Profile">
                    <span class="nav-icon">👤</span>
                    <span>Profile</span>
                </a>
                <a href="/verify" id="navVerify" style="display:none;" title="Verify Aadhaar">
                    <span class="nav-icon">⚠️</span>
                    <span>Verify</span>
                </a>
                <a href="/admin" id="adminLink" style="display:none;" title="Admin">
                    <span class="nav-icon">⚙️</span>
                    <span>Admin</span>
                </a>
                <a href="/login" id="navLogin" style="display:none;" title="Login">
                    <span class="nav-icon">🔑</span>
                    <span>Login</span>
                </a>
                <a href="#" id="navLogout" style="display:none;" onclick="logout(); return false;" title="Logout">
                    <span class="nav-icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                    <span>Dark Mode</span>
                </button>
            </div>
        </aside>

        <!-- Center Content -->
        <main class="feed-center" style="background: var(--auth-bg);">
            <div class="authorities-container">
                <!-- Header -->
                <div class="authorities-header">
                    <h1>District Authorities</h1>
                </div>

                <!-- Search and Filter Section -->
                <div class="search-section">
                    <div class="search-input-wrapper">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search by name, designation, or department..."
                        >
                        <button class="search-btn" id="searchBtn">Search</button>
                    </div>

                    <!-- Filters -->
                    <div class="filters-wrapper">
                        <div class="filter-group">
                            <label class="filter-label">State</label>
                            <div class="select-wrapper">
                                <select id="stateFilter" class="filter-select">
                                    <option value="">All States</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Gujarat">Gujarat</option>
                                    <option value="West Bengal">West Bengal</option>
                                    <option value="Punjab">Punjab</option>
                                    <option value="Haryana">Haryana</option>
                                    <option value="Rajasthan">Rajasthan</option>
                                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                                    <option value="Telangana">Telangana</option>
                                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                                    <option value="Bihar">Bihar</option>
                                    <option value="Jharkhand">Jharkhand</option>
                                    <option value="Odisha">Odisha</option>
                                    <option value="Assam">Assam</option>
                                    <option value="Kerala">Kerala</option>
                                    <option value="Goa">Goa</option>
                                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                                    <option value="Uttarakhand">Uttarakhand</option>
                                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                    <option value="Manipur">Manipur</option>
                                    <option value="Meghalaya">Meghalaya</option>
                                    <option value="Mizoram">Mizoram</option>
                                    <option value="Nagaland">Nagaland</option>
                                    <option value="Sikkim">Sikkim</option>
                                    <option value="Tripura">Tripura</option>
                                    <option value="Chhattisgarh">Chhattisgarh</option>
                                </select>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">District</label>
                            <div class="select-wrapper">
                                <select id="districtFilter" class="filter-select">
                                    <option value="">All Districts</option>
                                </select>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Area of Expertise</label>
                            <div class="select-wrapper">
                                <select id="expertiseFilter" class="filter-select">
                                    <option value="">All Expertise Areas</option>
                                    <option value="Roads & Potholes">Roads & Potholes</option>
                                    <option value="Sanitation & Waste">Sanitation & Waste</option>
                                    <option value="Water Supply">Water Supply</option>
                                    <option value="Sewer & Drainage">Sewer & Drainage</option>
                                    <option value="Electricity">Electricity</option>
                                    <option value="Flood Control">Flood Control</option>
                                    <option value="Urban Planning">Urban Planning</option>
                                    <option value="Traffic Management">Traffic Management</option>
                                    <option value="Public Parks & Horticulture">Public Parks & Horticulture</option>
                                    <option value="Street Lighting">Street Lighting</option>
                                    <option value="Others">Others</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Section -->
                <div class="summary-section">
                    <div class="summary-info">
                        <span style="color: var(--auth-text-muted); font-size: 0.9rem;">Filtering by: </span>
                        <span id="summaryState" style="color: var(--auth-text); font-weight: 600;">All States</span>, 
                        <span id="summaryDistrict" style="color: var(--auth-text); font-weight: 600;">All Districts</span>
                    </div>
                    <div class="summary-stats">
                        <div class="stat-box">
                            <span class="stat-label">Districts</span>
                            <span class="stat-value" id="districtMatches">0</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Authorities</span>
                            <span class="stat-value" id="authorityMatches">0</span>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="results-grid" id="resultsSection">
                    <p class="results-empty-message">No authorities found for the selected filters.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            // Update navigation based on auth status
            await updateNavigation();
        });

        const stateFilter = document.getElementById('stateFilter');
        const districtFilter = document.getElementById('districtFilter');
        const searchBtn = document.getElementById('searchBtn');

        // Populate filters from database
        async function loadDistinctFilters() {
            try {
                const response = await fetch('/api/authority/distinct-values');
                if (!response.ok) throw new Error('Unable to fetch filter values');

                const { states, districts, expertise } = await response.json();

                stateFilter.innerHTML = '<option value="">All States</option>';
                states.forEach(state => {
                    const opt = document.createElement('option');
                    opt.value = state;
                    opt.textContent = state;
                    stateFilter.appendChild(opt);
                });

                districtFilter.innerHTML = '<option value="">All Districts</option>';
                districts.forEach(district => {
                    const opt = document.createElement('option');
                    opt.value = district;
                    opt.textContent = district;
                    districtFilter.appendChild(opt);
                });

                const expertiseFilter = document.getElementById('expertiseFilter');
                expertiseFilter.innerHTML = '<option value="">All Expertise Areas</option>';
                const defaultExpertise = ['Roads & Potholes', 'Sanitation & Waste', 'Water Supply', 'Sewer & Drainage', 'Electricity', 'Flood Control', 'Urban Planning', 'Traffic Management', 'Public Parks & Horticulture', 'Street Lighting', 'Others'];
                defaultExpertise.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    expertiseFilter.appendChild(opt);
                });

                expertise
                    .filter(item => !defaultExpertise.includes(item))
                    .forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item;
                        opt.textContent = item;
                        expertiseFilter.appendChild(opt);
                    });

            } catch (error) {
                console.error('Error loading filter values:', error);
            }
        }

        // Make the district list reactive to the selected state
        async function refreshDistrictOptions() {
            const selectedState = stateFilter.value;
            try {
                const qs = new URLSearchParams();
                if (selectedState) qs.append('state', selectedState);

                const response = await fetch(`/api/authority/distinct-values?${qs.toString()}`);
                if (!response.ok) throw new Error('Unable to fetch districts for selected state');

                const { districts } = await response.json();
                districtFilter.innerHTML = '<option value="">All Districts</option>';
                districts.forEach(district => {
                    const opt = document.createElement('option');
                    opt.value = district;
                    opt.textContent = district;
                    districtFilter.appendChild(opt);
                });
            } catch (error) {
                console.error('Error refreshing district options:', error);
            }
        }

        stateFilter.addEventListener('change', () => {
            refreshDistrictOptions();
            updateSummary();
            fetchAuthorities();
        });

        districtFilter.addEventListener('change', () => {
            updateSummary();
            fetchAuthorities();
        });

        // Update summary when filters change
        function updateSummary() {
            const state = stateFilter.value || 'All States';
            const district = districtFilter.value || 'All Districts';
            const expertise = document.getElementById('expertiseFilter').value || 'All expertise areas';

            document.getElementById('summaryState').textContent = state;
            document.getElementById('summaryDistrict').textContent = district;
        }

        stateFilter.addEventListener('change', updateSummary);
        districtFilter.addEventListener('change', updateSummary);
        document.getElementById('expertiseFilter').addEventListener('change', updateSummary);

        const resultsSection = document.getElementById('resultsSection');

        async function fetchAuthorities() {
            const state = stateFilter.value;
            const district = districtFilter.value;
            const expertise = document.getElementById('expertiseFilter').value;
            const searchText = document.getElementById('searchInput').value.trim();

            const params = new URLSearchParams();
            if (state) params.append('state', state);
            if (district) params.append('district', district);
            if (expertise) params.append('expertise', expertise);
            if (searchText) params.append('search', searchText);
            params.append('limit', '2000');

            try {
                const response = await fetch(`/api/authority?${params.toString()}`);
                if (!response.ok) {
                    throw new Error('Failed to load authorities');
                }
                const { authorities, total, uniqueDistrictsCount } = await response.json();
                renderAuthorities(authorities);

                document.getElementById('districtMatches').textContent = uniqueDistrictsCount || 0;
                document.getElementById('authorityMatches').textContent = total || 0;

                if (authorities.length === 0) {
                    resultsSection.innerHTML = '<p class="results-empty-message">No authorities found for the selected filters.</p>';
                }

            } catch (error) {
                resultsSection.innerHTML = `<p class="results-empty-message">Error fetching authorities: ${error.message}</p>`;
                console.error('Authority API error:', error);
            }
        }

        function renderAuthorities(authorities) {
            if (!Array.isArray(authorities) || authorities.length === 0) {
                resultsSection.innerHTML = '<p class="results-empty-message">No authorities found for the selected filters.</p>';
                return;
            }

            const cards = authorities.map(record => {
                const auth = record;
                const user = auth.userId || {};
                const name = user.displayName || auth.designation || 'Unknown';
                const designation = auth.designation || 'Authority';
                const dept = auth.department || 'N/A';
                const district = auth.jurisdictionDistrict || 'Unknown';
                const state = auth.jurisdictionState || 'Unknown';
                const expertise = auth.areaOfExpertise || 'Others';
                const rating = auth.averageRating || 0;

                console.log('Rendering authority card for ID:', auth._id);
                return `
                    <div class="authority-card" onclick="window.location.href='/authority/${auth._id}'">
                        <div class="authority-card-header">
                            <div class="authority-name">${name}</div>
                            <div class="authority-designation">${designation}</div>
                            <div class="authority-badge">${expertise}</div>
                        </div>
                        <div class="authority-details">
                            <div class="detail-item">
                                <label>Department</label>
                                <value>${dept}</value>
                            </div>
                            <div class="detail-item">
                                <label>Location</label>
                                <value>${district}, ${state}</value>
                            </div>
                            <div class="detail-item">
                                <label>Rating</label>
                                <div class="rating-pill">⭐ ${rating.toFixed(1)}</div>
                            </div>
                            <div class="detail-item">
                                <label>Status</label>
                                <value style="color: #4caf50;">● Active</value>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            resultsSection.innerHTML = cards;
        }

        searchBtn.addEventListener('click', () => {
            updateSummary();
            fetchAuthorities();
        });

        document.getElementById('expertiseFilter').addEventListener('change', () => {
            updateSummary();
            fetchAuthorities();
        });

        document.getElementById('searchInput').addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                updateSummary();
                fetchAuthorities();
            }
        });

        // Initialize page
        loadDistinctFilters().then(() => {
            updateSummary();
            fetchAuthorities();
        }).catch(err => {
            console.error('Failed to load distinct values on init:', err);
            updateSummary();
            fetchAuthorities();
        });
    </script>
</body>
</html>
